syntax = "proto3";

package dynamo.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/pquerna/protoc-gen-dynamo/dynamo/v1";

// TODO(pquerna): register here
// https://github.com/protocolbuffers/protobuf/blob/master/docs/options.md
extend google.protobuf.MessageOptions {
  DynamoMessageOptions msg = 6000;
}

message DynamoMessageOptions {
  // Disables generation for this message
  bool disabled = 1;
  // A compound value that can be used as a partition and sort key. Multiple
  // keys will be added as gsi keys after the first.
  repeated Key key = 2;
  // Write priority for changes to this type, stamped on every keyed item as
  // the "wp" attribute. Only valid on keyed messages. If neither is set, the
  // priority is NORMAL and may be overridden per write.
  oneof priority {
    // Default priority. A single write may override it with the generated
    // MarshalDynamoItemWithPriority method.
    WritePriority write_priority = 3;
    // Fixed priority: every write of this type carries it, and no override
    // method is generated, so a per-write change does not compile. Must not be
    // WRITE_PRIORITY_UNSPECIFIED.
    WritePriority pinned_write_priority = 4;
  }
}

// The value stored in DynamoDB for an enum value annotated with it.
// Persisted data contract: never change a value once released.
extend google.protobuf.EnumValueOptions {
  string attr_value = 6000;
}

// Priority of a write. Although it is stored on the item (as the "wp"
// attribute), it characterizes how the change itself should be processed,
// not the object: change-stream consumers use it to tell high-priority writes
// from bulk ones. It is not part of the message and is ignored on unmarshal.
enum WritePriority {
  // Treated as NORMAL. Exists so an unset option has a defined meaning.
  WRITE_PRIORITY_UNSPECIFIED = 0;
  WRITE_PRIORITY_NORMAL = 1 [(dynamo.v1.attr_value) = "normal"];
  WRITE_PRIORITY_BACKGROUND = 2 [(dynamo.v1.attr_value) = "background"];
}

message Key {
  repeated string pk_fields = 1;
  repeated string sk_fields = 2;
  // If set, the value of sort key is set to a constant string.  In this case
  // sk_fields is ignored.
  string sk_const = 3;
  ShardOptions shard = 4;
}

message ShardOptions {
  reserved 1;
  reserved "enabled";
  uint32 shard_count = 2;
}

extend google.protobuf.FieldOptions {
  DynamoFieldOptions field = 6000;
}

message DynamoFieldOptions {
  bool expose = 1;
  string name = 2;
  Types type = 3;
}

message Types {
  bool set = 200;
  bool unix_second = 300;
  bool unix_milli = 301;
  bool unix_nano = 302;
}
